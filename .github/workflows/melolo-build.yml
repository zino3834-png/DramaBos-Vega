name: Melolo provider build

on:
  push:
    branches:
      - add-melolo-provider

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check providers
        run: npx tsc --noEmit

      - name: Build all providers
        run: npm run build
