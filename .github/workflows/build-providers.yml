name: Build Vega providers

on:
  push:
    branches: [main]
    paths:
      - "providers/**"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "build-bundled.js"
      - ".github/workflows/build-providers.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated provider bundles
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Build DramaBos provider bundles"
            git push
          else
            echo "No generated bundle changes."
          fi
